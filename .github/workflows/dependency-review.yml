name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Dependency review needs the dependency graph, which private repositories
    # only get with GitHub Advanced Security. Public repositories run it always.
    if: github.event.repository.visibility == 'public' || vars.ENABLE_ADVANCED_SECURITY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0
