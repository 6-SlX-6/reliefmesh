name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Publish container images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: reliefmesh-api
            context: apps/api
            file: apps/api/Dockerfile
          - name: reliefmesh-web
            context: .
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # arm64 for small field servers such as a Raspberry Pi.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            RELIEFMESH_BUILD_REVISION=${{ github.sha }}
          provenance: true
          sbom: true

  binaries:
    name: Build API binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Build
        working-directory: apps/api
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X github.com/6-slx-6/reliefmesh/apps/api/internal/health.Version=${version}" \
              -o "dist/reliefmesh-api-linux-$arch" ./cmd/reliefmesh-api
          done
          (cd dist && sha256sum reliefmesh-api-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/api/dist/reliefmesh-api-linux-amd64
            apps/api/dist/reliefmesh-api-linux-arm64
            apps/api/dist/SHA256SUMS
