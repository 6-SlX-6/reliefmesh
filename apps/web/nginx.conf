# Static file server for the ReliefMesh web app (inside the web container).
# TLS, the API proxy and HSTS are handled by the Caddy reverse proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/reliefmesh-csp.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Fingerprinted build assets can be cached forever.
    location /_nuxt/ {
        include /etc/nginx/reliefmesh-csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker, manifest and HTML shell must always be revalidated
    # so updates reach devices.
    location ~* ^/(sw\.js|manifest\.webmanifest|index\.html|200\.html)$ {
        include /etc/nginx/reliefmesh-csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # Client-side routing: unknown paths get the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/reliefmesh-csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
